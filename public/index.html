<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEV Automation</title><style>body{margin:0;background:#090b0e;color:#eef1f5;font-family:system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:34px 20px}h1{margin:0 0 6px}.muted{color:#929ba7}textarea{width:100%;min-height:130px;box-sizing:border-box;margin-top:20px;padding:15px;border:1px solid #29303a;border-radius:12px;background:#11151a;color:#fff;font:inherit}button{margin-top:12px;padding:11px 18px;border:0;border-radius:9px;background:#fff;color:#111;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}.card,.panel{background:#11151a;border:1px solid #242b34;border-radius:12px}.card{padding:14px}#stop{background:#ff5f56;color:#fff;margin-left:8px}.value{font-size:21px;font-weight:800;margin-top:5px}.label{color:#8e97a4;font-size:11px;text-transform:uppercase}.panel{margin-top:20px;overflow:hidden}.panel-header{padding:12px 14px;border-bottom:1px solid #242b34;font-weight:800}#result{padding:14px;white-space:pre-wrap;max-height:360px;overflow:auto;display:none}#logs{height:390px;overflow:auto;padding:12px 14px;font:12px ui-monospace,monospace}.log{padding:6px 0;border-bottom:1px solid #1c2127}.error{color:#ff7777}.success{color:#78e6a1}.decision{color:#7db7ff}.status{color:#d7b4ff}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><h1>JEV Automation</h1><div class="muted">Describe what you want a real browser to do. JEV plans the next action; Playwright executes it.</div><textarea id="task" placeholder='Examples: Open https://example.com and find pricing. Search Google for "Playwright". Fill a form with exact values in quotes.'></textarea><div><button id="run">Run automation</button><button id="stop" disabled>Stop automation</button></div><section class="grid"><div class="card"><div class="label">Status</div><div class="value" id="status">Idle</div></div><div class="card"><div class="label">Steps</div><div class="value" id="steps">0</div></div><div class="card"><div class="label">Tokens</div><div class="value" id="tokens">0</div></div><div class="card"><div class="label">JEV speed</div><div class="value" id="speed">0 tok/s</div></div><div class="card"><div class="label">Latency</div><div class="value" id="latency">0 ms</div></div></section><section class="panel"><div class="panel-header">Extracted result</div><pre id="result"></pre></section><section class="panel"><div class="panel-header">Live logs</div><div id="logs"></div></section></main><script>const q=id=>document.getElementById(id),run=q("run"),stop=q("stop"),task=q("task"),status=q("status"),steps=q("steps"),tokens=q("tokens"),speed=q("speed"),latency=q("latency"),logs=q("logs"),result=q("result");let currentJob=null,es=null;function log(m,c=""){const x=document.createElement("div");x.className="log "+c;x.textContent="["+new Date().toLocaleTimeString()+"] "+m;logs.appendChild(x);logs.scrollTop=logs.scrollHeight}run.onclick=async()=>{const t=task.value.trim();if(!t)return log("Enter a task first.","error");run.disabled=true;stop.disabled=false;logs.innerHTML="";result.style.display="none";try{const r=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:t})}),d=await r.json();if(!r.ok)throw Error(d.error);log("Job started: "+d.jobId,"status");currentJob=d.jobId;es=new EventSource("/api/jobs/"+d.jobId+"/events");es.onmessage=e=>{const x=JSON.parse(e.data);if(x.event==="status"){status.textContent=x.status;log(x.message,"status")}if(x.event==="step_started"){steps.textContent=x.step;status.textContent="Thinking";log(x.message,"status")}if(x.event==="page_state")log("Page: "+(x.title||"(untitled)")+" — "+x.url);if(x.event==="jev_decision"){status.textContent="Executing";latency.textContent=x.latencyMs+" ms";tokens.textContent=x.cumulative.totalTokens;log("JEV → "+x.decision+" | "+x.latencyMs+" ms","decision")}if(x.event==="action")log("Action: "+x.description,"status");if(x.event==="action_complete")log("Action completed in "+x.latencyMs+" ms");if(x.event==="extracted"){result.style.display="block";result.textContent=x.text||"";log("Extracted "+(x.text?.length||0)+" characters","success")}if(x.event==="download")log("Download detected: "+x.filename,"success");if(x.event==="tab_opened")log("New tab: "+x.title+" — "+x.url,"status");if(x.event==="gemini_recovery_started"){status.textContent="Gemini recovery";log(x.message,"status")}if(x.event==="gemini_recovery"){log("Gemini suggested: "+JSON.stringify(x.action),"decision")}if(x.event==="stop_requested"){status.textContent="Stopping";log(x.message,"error")}if(x.event==="error"){status.textContent=x.fatal?"Failed":"Recovering";log((x.source||"agent")+": "+x.message,"error")}if(x.event==="complete"){status.textContent=x.stats?.status==="completed"?"Completed":"Failed";tokens.textContent=x.stats?.totalTokens||0;speed.textContent=(x.stats?.tokensPerSecond||0)+" tok/s";latency.textContent=(x.stats?.averageJevLatencyMs||0)+" ms";log(x.message,x.stats?.status==="completed"?"success":"error");es.close();run.disabled=false;stop.disabled=true;currentJob=null}}}catch(e){status.textContent="Error";log(e.message,"error");run.disabled=false;stop.disabled=true}};stop.onclick=async()=>{if(!currentJob)return;stop.disabled=true;try{await fetch("/api/jobs/"+currentJob+"/stop",{method:"POST"});log("Stop signal sent.","error")}catch(e){log(e.message,"error")}};</script></body></html>
